name: Test & Deploy

on:
  push:
    branches: [master]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx jest --ci --passWithNoTests
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SITE_URL: ${{ secrets.EXPO_PUBLIC_SITE_URL }}

      - name: Build (Expo export)
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SITE_URL: ${{ secrets.EXPO_PUBLIC_SITE_URL }}

      # Expo regenerates dist/ from scratch: it produces a fresh hashed bundle
      # but a bare index.html and drops the hand-maintained PWA files. We keep
      # the FRESH bundle, restore the PWA-complete index.html + PWA assets from
      # git, and rewrite index.html to point at the freshly built bundle.
      - name: Assemble PWA dist
        run: |
          set -euo pipefail
          NEW_BUNDLE="$(basename "$(ls dist/_expo/static/js/web/AppEntry-*.js | head -n1)")"
          echo "Fresh bundle: $NEW_BUNDLE"
          git checkout HEAD -- \
            dist/index.html dist/manifest.json dist/sw.js \
            dist/favicon.png dist/icon-192.png dist/icon-512.png
          sed -i -E "s#AppEntry-[a-f0-9]+\.js#${NEW_BUNDLE}#g" dist/index.html
          # Drop any stale committed bundle so only the fresh one ships.
          find dist/_expo/static/js/web -name 'AppEntry-*.js' ! -name "${NEW_BUNDLE}" -delete
          grep -q "$NEW_BUNDLE" dist/index.html

      - name: Deploy via SFTP
        run: |
          sudo apt-get install -y lftp
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" sftp://${{ secrets.FTP_SERVER }} <<'LFTP'
          set sftp:auto-confirm yes
          # Deploy to the webspace root: app.pk-fussballschule.de serves from `/`,
          # and index.html references its assets with absolute paths (/_expo/...),
          # so the bundle only resolves when the app lives at the root.
          mirror -R ./dist/ /
          # index.html keeps a constant byte size on every build (the bundle hash
          # is always 32 hex chars), so `mirror` treats it as unchanged and never
          # re-uploads it — the site stays pinned to the old bundle. Force the
          # hand-maintained, size-stable files explicitly so the new bundle hash
          # actually goes live.
          put -O / ./dist/index.html
          put -O / ./dist/sw.js
          bye
          LFTP
